<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generador de Bitácoras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-name">Bitácora</span>
      <span class="brand-sub">Local · sin cuenta</span>
    </div>

    <nav class="nav" id="nav">
      <a class="nav-item" href="#/hoy" data-view="hoy" data-short="Hoy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <span class="nav-label">Hoy</span>
      </a>
      <a class="nav-item" href="#/kanban" data-view="kanban" data-short="Kanban">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"></rect><rect x="10" y="4" width="5" height="11" rx="1.5"></rect><rect x="17" y="4" width="4" height="7" rx="1.5"></rect></svg>
        <span class="nav-label">Kanban</span>
      </a>
      <a class="nav-item" href="#/semana" data-view="semana" data-short="Semana">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        <span class="nav-label">Semana</span>
      </a>
      <a class="nav-item" href="#/recordatorios" data-view="recordatorios" data-short="Avisos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"></path><path d="M10.5 20a2 2 0 0 0 3 0"></path></svg>
        <span class="nav-label">Recordatorios</span>
        <span class="nav-badge" id="navBadge" hidden>0</span>
      </a>
      <a class="nav-item" href="#/ajustes" data-view="ajustes" data-short="Ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"></circle><path d="M19.4 14a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 4 14a2 2 0 1 1 0-4 1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 4.6a2 2 0 1 1 4 0 1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.6 1.6 0 0 0 20 10a2 2 0 1 1 0 4z"></path></svg>
        <span class="nav-label">Ajustes</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="mini-card">
        <span class="eyebrow">Registrado hoy</span>
        <span class="mono xl" data-live="today">00:00:00</span>
        <span class="hint" id="sideWeek">Semana —</span>
      </div>
      <div class="seg" role="group" aria-label="Tema">
        <button type="button" class="seg-btn" data-act="theme" data-theme="system">Auto</button>
        <button type="button" class="seg-btn" data-act="theme" data-theme="light">Claro</button>
        <button type="button" class="seg-btn" data-act="theme" data-theme="dark">Oscuro</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div id="banner" class="banner" hidden></div>
    <div id="view" class="view"></div>
  </main>
</div>

<dialog id="dlg" class="dlg" aria-labelledby="dlgTitle">
  <div id="dlgForm">
    <div class="dlg-head">
      <h2 id="dlgTitle" class="dlg-title">Tarea</h2>
      <button type="button" class="icon-btn" data-act="dlg-close" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-foot" id="dlgFoot"></div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
